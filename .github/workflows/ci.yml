name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: backend/package.json

      - name: Install dependencies
        working-directory: backend
        run: npm install

      - name: Run API tests
        working-directory: backend
        run: npm test

      - name: Build Docker image
        run: docker build -t it-requests-system .

      - name: Health check in container
        run: |
          docker run -d --name it-requests-test -p 3001:3000 -e JWT_SECRET=ci-test-secret it-requests-system
          sleep 5
          
          echo "=== DOCKER CONTAINER STATUS ==="
          docker ps -a
          
          echo "=== DOCKER CONTAINER LOGS ==="
          docker logs it-requests-test
          
          echo "=== RUNNING CURL ==="
          curl -f http://localhost:3001/api/health
