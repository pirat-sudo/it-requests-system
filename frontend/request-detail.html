<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заявка — IT Requests</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="app-shell">
    <nav class="navbar">
        <div class="nav-container">
            <a href="dashboard.html" class="nav-brand">
                <span class="brand-icon">IT</span>
                <span>Requests</span>
            </a>
            <div class="nav-menu">
                <div class="nav-user-block">
                    <span id="userName" class="nav-user"></span>
                    <span id="userRole" class="role-badge"></span>
                </div>
                <button type="button" id="btnBack" class="btn btn-secondary">← Назад</button>
                <button type="button" id="btnLogout" class="btn btn-ghost">Выйти</button>
            </div>
        </div>
    </nav>

    <main class="page-content detail-grid">
        <div id="requestDetails" class="request-details"></div>

        <section class="panel">
            <h3>Комментарии</h3>
            <div id="commentsList" class="comments-list"></div>
            <div class="add-comment">
                <textarea id="newComment" rows="3" placeholder="Напишите комментарий..."></textarea>
                <button type="button" id="btnAddComment" class="btn btn-primary">Отправить</button>
            </div>
        </section>

        <section class="panel">
            <h3>История статусов</h3>
            <div id="statusHistory" class="history-list"></div>
        </section>
    </main>

    <script src="js/api.js"></script>
    <script src="js/common.js"></script>
    <script src="js/request-detail.js"></script>
</body>
</html>
